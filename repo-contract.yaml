contract_version: "1.1"
contract_id: "YL-REPO-CONTRACT-GBRAIN-20260806-0001"
effective_date: "2026-08-06"

repository:
  repository_id: "github:moonstachain/gbrain-yuanli"
  repository_name: "gbrain-yuanli"
  repository_role: "rebuildable_c2_retrieval_synthesis_graph_runtime"
  owner: "RAY"
  maintainers:
    - "moonstachain"

architecture_alignment:
  program: "ARCH-1"
  authority_map_ref: "github:moonstachain/yuanli-strategy-soul/docs/architecture/SOURCE-VENTURE-EVOLUTION-AUTHORITY-MAP-v1.md"
  c2_plane: "epistemic_cognitive_plane"
  component_role: "replaceable_retrieval_synthesis_graph_engine"
  c2_is_not_equivalent_to_this_repository: true
  technical_component_replaceable: true
  changes_c2_canon: false

authority:
  institutional_authority: "github:moonstachain/yuanli-strategy-soul"
  system_of_record_for:
    - "gbrain_runtime_code"
    - "retrieval_and_graph_runtime_configuration"
    - "runtime_evaluation_results"
  consumes_from:
    - "local://obsidian/llm-wiki"
    - "github:moonstachain/llm-wiki"
    - "github:moonstachain/yuanli-strategy-soul"
  projects_to:
    - "github:moonstachain/yuanli-os-max"
    - "approved_agent_mcp_clients"
  must_not_become:
    - "complete_C2"
    - "second_knowledge_canon"
    - "second_founder_genome"
    - "method_canon"
    - "C3_decision_authority"
    - "C4_action_or_outcome_authority"
    - "real_world_action_authority"

objects:
  authoritative_object_types:
    - "runtime_code"
    - "runtime_configuration"
    - "retrieval_evaluation"
    - "graph_projection"
    - "runtime_index"
  derived_object_types:
    - "synthesized_answer"
    - "gap_analysis"
    - "citation_projection"
    - "entity_edge_projection"
  prohibited_duplicate_object_types:
    - "raw_evidence"
    - "knowledge_canon"
    - "founder_genome"
    - "decision_record"
    - "action_receipt"
    - "outcome_record"

write_policy:
  ai_may_propose:
    - "runtime_patch"
    - "evaluation_candidate"
    - "gap_candidate"
  ai_may_write:
    - "rebuildable_index"
    - "runtime_cache"
    - "evaluation_receipt"
    - "derived_graph_edge"
  human_approval_required:
    - "source_scope_change"
    - "protected_type_change"
    - "cross_tenant_access_change"
    - "production_runtime_release"
  founder_only: []

lineage:
  id_policy_ref: "github:moonstachain/yuanli-strategy-soul/governance/id-and-trace-policy.yaml"
  trace_policy_ref: "github:moonstachain/yuanli-strategy-soul/governance/id-and-trace-policy.yaml"
  authority_ledger_ref: "github:moonstachain/yuanli-strategy-soul/governance/authority-ledgers.yaml"
  upstream_contracts:
    - "github:moonstachain/yuanli-strategy-soul/repo-contract.yaml"
    - "github:moonstachain/llm-wiki/repo-contract.yaml"
  downstream_contracts:
    - "github:moonstachain/yuanli-os-max/repo-contract.yaml"

privacy:
  default_sensitivity: "private"
  public_projection_allowed: false
  forbidden_content:
    - "credentials_or_tokens"
    - "cross_tenant_private_data"
    - "unapproved_source_material"

failure_policy:
  unresolved_authority_conflict: "fail_closed"
  missing_source_lineage: "exclude_from_synthesis"
  missing_human_gate: "block_protected_change"
  stale_projection: "rebuild"
  source_scope_violation: "reject"
  attempt_to_assume_C2_or_C3_C4_authority: "reject"

status:
  contract_status: "active"
  approved_by: "RAY"
  approved_at: "2026-08-19T19:44:00+08:00"
  merged_pr: 4
  merged_commit: "869b1db4c21d43fbf4832108b3deb13b02c91694"
  activated_at: "2026-08-19T19:55:00+08:00"
  arch1_human_decision: "ACCEPT_ARCH1_1PLUS4PLUS1_REPOSITORY_AUTHORITY_CONVERGENCE"
