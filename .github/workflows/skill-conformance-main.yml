name: Skill Conformance (main)

on:
  pull_request:
    branches: [main]
    paths:
      - 'skills/**'
      - 'openclaw.plugin.json'
      - 'src/core/routing-eval.ts'
      - 'test/routing-eval-unicode.test.ts'
      - 'test/skills-conformance.test.ts'
      - 'test/resolver.test.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skill-conformance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  skill-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
      - run: bun install
      - name: Run skill conformance and resolver gates
        run: bun test test/skills-conformance.test.ts test/resolver.test.ts test/routing-eval-unicode.test.ts
